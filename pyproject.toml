[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Hand-built MLOps platform: model registry, drift detection, automated retraining, canary deployment"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scikit-learn", "scipy", "joblib", "fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
