name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlops-pipeline .
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 mlops-pipeline
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/health | grep '"production":1'
